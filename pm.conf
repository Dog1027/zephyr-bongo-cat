# Experimental: enter light sleep while idle between frames.
# Build with: just build-pm
#
# Caveats (ESP32-C3, current Zephyr):
# - Light sleep only wakes on the RTC timer, not on key presses; the main
#   loop wakes at least every LVGL refresh period, so keys are picked up then.
# - The USB Serial/JTAG console may drop while sleeping.
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_COUNTER=y
